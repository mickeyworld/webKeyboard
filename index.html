<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Keychron K8 Max Full Layout</title>
    <style>
        :root {
            --case: #222225;
            --key-main: #3a3a3c;    /* アルファベット・数字 */
            --key-mod: #2c2c2e;     /* 修飾キー */
            --key-accent: #d43f33;  /* Esc */
            --text: #ffffff;
            --sub: #aaaaaa;
            --gap: 3px; /* スマホ用に隙間を少し狭く調整 */
        }
        body {
            background: #0d0d0d; color: var(--text); font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 0; margin: 0;
            width: 100vw; height: 100vh;
            overflow: hidden; /* スクロールを禁止して操作性を向上 */
        }

        /* キーボード全体のコンテナ（回転の基準点） */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        /* 縦画面（Portrait）のときだけ90度回転させる */
        @media (orientation: portrait) {
            .container {
                transform: rotate(90deg);
                transform-origin: center;
                width: 100vh; /* 縦横入れ替え */
                height: 100vw;
            }
        }

        .status-bar { 
            width: 95%; 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            font-size: 11px; 
        }

        /* キーボード筐体: 画面幅に合わせてスケーリング */
        .k8-board {
            background: var(--case); 
            padding: 10px; 
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(80, 1fr); /* 12px固定ではなく、画面幅に追従 */
            gap: var(--gap);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 98vw; /* 画面端まで使い切る */
            max-width: 1200px;
        }

        /* 共通キー設定 */
        .key {
            background: var(--key-main); border-radius: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 600; 
            height: 8vw; /* 高さを画面幅に対して可変にする */
            max-height: 50px;
            cursor: pointer; user-select: none;
            grid-column: span 4;
            border-bottom: 2px solid #1a1a1a;
            touch-action: manipulation;
        }

        /* 特殊キーの幅（1U = 4ユニット基準） */
        .u1-25 { grid-column: span 5; }  /* Ctrl, Win, Alt... */
        .u1-5  { grid-column: span 6; }  /* Tab, Backslash */
        .u1-75 { grid-column: span 7; }  /* CapsLock */
        .u2    { grid-column: span 8; }  /* Backspace */
        .u2-25 { grid-column: span 9; }  /* Enter, L-Shift */
        .u2-75 { grid-column: span 11; } /* R-Shift */
        .u6-25 { grid-column: span 25; } /* Spacebar */

        /* 特殊カラー */
        .esc { background: var(--key-accent); border-bottom-color: #8b2a22; }
        .mod { background: var(--key-mod); }

        /* 隙間（セパレーション） */
        .sp-f-esc { grid-column: span 4; }
        .sp-f-f4-f5 { grid-column: span 2; }
        .sp-f-f8-f9 { grid-column: span 2; }
        .sp-nav { grid-column: span 4; } /* メインとナビゲーションの間の大きな隙間 */
        .sp-nav-right { grid-column: span 4; } /* ナビゲーションの右の大きな隙間 */
        .sp-none { grid-column: span 4; visibility: hidden; } /* アローキー周りの空き */
    </style>
</head>
<body>

<div class="status-bar">
    <div id="status">K8 MAX: DISCONNECTED</div>
    <button id="connectBtn">CONNECT ESP32</button>
</div>

<div class="k8-board">
    <div class="key esc" onpointerdown="send('+ESC')" onpointerup="send('-ESC')">Esc</div>
    <div class="sp-f-esc"></div>
    <div class="key" onpointerdown="send('+F1')" onpointerup="send('-F1')">F1</div>
    <div class="key" onpointerdown="send('+F2')" onpointerup="send('-F2')">F2</div>
    <div class="key" onpointerdown="send('+F3')" onpointerup="send('-F3')">F3</div>
    <div class="key" onpointerdown="send('+F4')" onpointerup="send('-F4')">F4</div>
    <div class="sp-f-f4-f5"></div>
    <div class="key" onpointerdown="send('+F5')" onpointerup="send('-F5')">F5</div>
    <div class="key" onpointerdown="send('+F6')" onpointerup="send('-F6')">F6</div>
    <div class="key" onpointerdown="send('+F7')" onpointerup="send('-F7')">F7</div>
    <div class="key" onpointerdown="send('+F8')" onpointerup="send('-F8')">F8</div>
    <div class="sp-f-f8-f9"></div>
    <div class="key" onpointerdown="send('+F9')" onpointerup="send('-F9')">F9</div>
    <div class="key" onpointerdown="send('+F10')" onpointerup="send('-F10')">F10</div>
    <div class="key" onpointerdown="send('+F11')" onpointerup="send('-F11')">F11</div>
    <div class="key" onpointerdown="send('+F12')" onpointerup="send('-F12')">F12</div>
    <div class="sp-nav"></div>
    <div class="key mod" onpointerdown="send('+PRINT_SCREEN')" onpointerup="send('-PRINT_SCREEN')">📸</div>
    <div class="key mod" onpointerdown="send('+SL')" onpointerup="send('-SL')">🎤</div>
    <div class="key mod" onpointerdown="send('+LIGHT')" onpointerup="send('-LIGHT')">💡</div>
    <div class="sp-nav-right"></div>

    <div class="key mod" onpointerdown="send('+\`')" onpointerup="send('-\`')"><span class="sub">~</span>`</div>
    <div class="key" onpointerdown="send('+1')" onpointerup="send('-1')"><span class="sub">!</span>1</div>
    <div class="key" onpointerdown="send('+2')" onpointerup="send('-2')"><span class="sub">@</span>2</div>
    <div class="key" onpointerdown="send('+3')" onpointerup="send('-3')"><span class="sub">#</span>3</div>
    <div class="key" onpointerdown="send('+4')" onpointerup="send('-4')"><span class="sub">$</span>4</div>
    <div class="key" onpointerdown="send('+5')" onpointerup="send('-5')"><span class="sub">%</span>5</div>
    <div class="key" onpointerdown="send('+6')" onpointerup="send('-6')"><span class="sub">^</span>6</div>
    <div class="key" onpointerdown="send('+7')" onpointerup="send('-7')"><span class="sub">&</span>7</div>
    <div class="key" onpointerdown="send('+8')" onpointerup="send('-8')"><span class="sub">*</span>8</div>
    <div class="key" onpointerdown="send('+9')" onpointerup="send('-9')"><span class="sub">(</span>9</div>
    <div class="key" onpointerdown="send('+0')" onpointerup="send('-0')"><span class="sub">)</span>0</div>
    <div class="key" onpointerdown="send('+-')" onpointerup="send('--')"><span class="sub">_</span>-</div>
    <div class="key" onpointerdown="send('+=')" onpointerup="send('-=')"><span class="sub">+</span>=</div>
    <div class="key mod u2" onpointerdown="send('+BACKSPACE')" onpointerup="send('-BACKSPACE')">Backspace</div>
    <div class="sp-nav"></div>
    <div class="key mod" onpointerdown="send('+INSERT')" onpointerup="send('-INSERT')">Ins</div>
    <div class="key mod" onpointerdown="send('+HOME')" onpointerup="send('-HOME')">Home</div>
    <div class="key mod" onpointerdown="send('+PAGE_UP')" onpointerup="send('-PAGE_UP')">PgUp</div>
    <div class="sp-nav-right"></div>
    
    <div class="key mod u1-5" onpointerdown="send('+TAB')" onpointerup="send('-TAB')">Tab</div>
    <div class="key" onpointerdown="send('+q')" onpointerup="send('-q')">Q</div>
    <div class="key" onpointerdown="send('+w')" onpointerup="send('-w')">W</div>
    <div class="key" onpointerdown="send('+e')" onpointerup="send('-e')">E</div>
    <div class="key" onpointerdown="send('+r')" onpointerup="send('-r')">R</div>
    <div class="key" onpointerdown="send('+t')" onpointerup="send('-t')">T</div>
    <div class="key" onpointerdown="send('+y')" onpointerup="send('-y')">Y</div>
    <div class="key" onpointerdown="send('+u')" onpointerup="send('-u')">U</div>
    <div class="key" onpointerdown="send('+i')" onpointerup="send('-i')">I</div>
    <div class="key" onpointerdown="send('+o')" onpointerup="send('-o')">O</div>
    <div class="key" onpointerdown="send('+p')" onpointerup="send('-p')">P</div>
    <div class="key" onpointerdown="send('+[')" onpointerup="send('-[')"><span class="sub">{</span>[</div>
    <div class="key" onpointerdown="send('+]')" onpointerup="send('-]')"><span class="sub">}</span>]</div>
    <div class="key mod u1-5" onpointerdown="send('+\\')" onpointerup="send('-\\')"><span class="sub">|</span>\</div>
    <div class="sp-nav"></div>
    <div class="key mod" onpointerdown="send('+DELETE')" onpointerup="send('-DELETE')">Del</div>
    <div class="key mod" onpointerdown="send('+END')" onpointerup="send('-END')">End</div>
    <div class="key mod" onpointerdown="send('+PAGE_DOWN')" onpointerup="send('-PAGE_DOWN')">PgDn</div>
    <div class="sp-nav-right"></div>

    <div class="key mod u1-75" onpointerdown="send('+CAPS_LOCK')" onpointerup="send('-CAPS_LOCK')">Caps Lock</div>
    <div class="key" onpointerdown="send('+a')" onpointerup="send('-a')">A</div>
    <div class="key" onpointerdown="send('+s')" onpointerup="send('-s')">S</div>
    <div class="key" onpointerdown="send('+d')" onpointerup="send('-d')">D</div>
    <div class="key" onpointerdown="send('+f')" onpointerup="send('-f')">F</div>
    <div class="key" onpointerdown="send('+g')" onpointerup="send('-g')">G</div>
    <div class="key" onpointerdown="send('+h')" onpointerup="send('-h')">H</div>
    <div class="key" onpointerdown="send('+j')" onpointerup="send('-j')">J</div>
    <div class="key" onpointerdown="send('+k')" onpointerup="send('-k')">K</div>
    <div class="key" onpointerdown="send('+l')" onpointerup="send('-l')">L</div>
    <div class="key" onpointerdown="send('+;')" onpointerup="send('-;')"><span class="sub">:</span>;</div>
    <div class="key" onpointerdown="send('+\'')" onpointerup="send('-\'')"><span class="sub">"</span>'</div>
    <div class="key mod u2-25" onpointerdown="send('+RETURN')" onpointerup="send('-RETURN')">Enter</div>
    <div class="sp-nav"></div>
    <div style="grid-column: span 12; visibility: hidden;"></div>

    <div class="key mod u2-25" onpointerdown="send('+LEFT_SHIFT')" onpointerup="send('-LEFT_SHIFT')">Shift</div>
    <div class="key" onpointerdown="send('+z')" onpointerup="send('-z')">Z</div>
    <div class="key" onpointerdown="send('+x')" onpointerup="send('-x')">X</div>
    <div class="key" onpointerdown="send('+c')" onpointerup="send('-c')">C</div>
    <div class="key" onpointerdown="send('+v')" onpointerup="send('-v')">V</div>
    <div class="key" onpointerdown="send('+b')" onpointerup="send('-b')">B</div>
    <div class="key" onpointerdown="send('+n')" onpointerup="send('-n')">N</div>
    <div class="key" onpointerdown="send('+m')" onpointerup="send('-m')">M</div>
    <div class="key" onpointerdown="send('+,')" onpointerup="send('-,')"><span class="sub">&lt;</span>,</div>
    <div class="key" onpointerdown="send('+.')" onpointerup="send('-.')"><span class="sub">&gt;</span>.</div>
    <div class="key" onpointerdown="send('+/')" onpointerup="send('-/')"><span class="sub">?</span>/</div>
    <div class="key mod u2-75" onpointerdown="send('+RIGHT_SHIFT')" onpointerup="send('-RIGHT_SHIFT')">Shift</div>
    <div class="sp-nav"></div>
    <div class="sp-none"></div>
    <div class="key mod" onpointerdown="send('+UP_ARROW')" onpointerup="send('-UP_ARROW')">↑</div>
    <div class="sp-none"></div>

    <div class="key mod u1-25" onpointerdown="send('+LEFT_CTRL')" onpointerup="send('-LEFT_CTRL')">Ctrl</div>
    <div class="key mod u1-25" onpointerdown="send('+LEFT_ALT')" onpointerup="send('-LEFT_ALT')">Alt</div>
    <div class="key mod u1-25" onpointerdown="send('+LEFT_GUI')" onpointerup="send('-LEFT_GUI')">Win</div>
    <div class="key u6-25" onpointerdown="send('+SPACE')" onpointerup="send('-SPACE')"></div>
    <div class="key mod u1-25" onpointerdown="send('+RIGHT_GUI')" onpointerup="send('-RIGHT_GUI')">Win</div>
    <div class="key mod u1-25" onpointerdown="send('+RIGHT_ALT')" onpointerup="send('-RIGHT_ALT')">Alt</div>
    <div class="key mod u1-25" onpointerdown="send('+FN')" onpointerup="send('-FN')">Fn</div>
    <div class="key mod u1-25" onpointerdown="send('+RIGHT_CTRL')" onpointerup="send('-RIGHT_CTRL')">Ctrl</div>
    <div class="sp-nav"></div>
    <div class="key mod" onpointerdown="send('+LEFT_ARROW')" onpointerup="send('-LEFT_ARROW')">←</div>
    <div class="key mod" onpointerdown="send('+DOWN_ARROW')" onpointerup="send('-DOWN_ARROW')">↓</div>
    <div class="key mod" onpointerdown="send('+RIGHT_ARROW')" onpointerup="send('-RIGHT_ARROW')">→</div>
</div>

<script>
    let charWrite;
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    document.getElementById('connectBtn').addEventListener('click', async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32S3_HID_Bridge' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            charWrite = await service.getCharacteristic(CHAR_UUID);
            document.getElementById('status').innerText = "K8 MAX: CONNECTED";
            document.getElementById('status').style.color = "#4CAF50";
        } catch (e) { document.getElementById('status').innerText = "ERROR"; }
    });

    async function send(msg) {
        if (!charWrite) return;
        try { await charWrite.writeValueWithoutResponse(new TextEncoder().encode(msg)); } catch (e) {}
    }
</script>
</body>
</html>
